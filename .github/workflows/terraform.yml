name: Terraform Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "Modules/**"
      - "environment/**"
      - "app/**"

  pull_request:
    branches:
      - main
    paths:
      - "Modules/**"
      - "environment/**"
      - "app/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod

      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy


permissions:
  id-token: write
  contents: read
  pull-requests: write


jobs:

# =====================================================
# SONARCLOUD CODE QUALITY
# =====================================================

  sonarcloud:

    name: SonarCloud Scan

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"


    - name: Verify Java Version
      run: java -version


    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v3
      with:
        projectBaseDir: app
        args: >
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}

      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}



# =====================================================
# TERRAFORM PLAN
# =====================================================

  terraform-plan:

    name: Terraform Plan

    runs-on: ubuntu-latest

    needs: sonarcloud


    env:
      TF_WORKING_DIR: environment/${{ github.event.inputs.environment || 'dev' }}


    steps:


    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.8.5"


    - name: Azure Login OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform init -reconfigure
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_USE_OIDC: true


    - name: Terraform Validate
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform validate


    - name: Terraform Plan
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform plan -out=tfplan
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_USE_OIDC: true


    - name: Upload Terraform Plan
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-${{ github.event.inputs.environment || 'dev' }}
        path: ${{ env.TF_WORKING_DIR }}/tfplan



# =====================================================
# TERRAFORM APPLY
# =====================================================

  terraform-apply:

    name: Terraform Apply

    runs-on: ubuntu-latest

    needs: terraform-plan


    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}


    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'apply'


    env:
      TF_WORKING_DIR: environment/${{ github.event.inputs.environment }}


    steps:


    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.8.5"


    - name: Azure Login OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


    - name: Download Terraform Plan
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan-${{ github.event.inputs.environment }}
        path: ${{ env.TF_WORKING_DIR }}


    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform init -reconfigure
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_USE_OIDC: true


    - name: Terraform Apply
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform apply tfplan
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_USE_OIDC: true