name: Blue/Green Deploy to Production

# ============================================================
# Blue/Green Deployment
#
# Flow:
# 1. Detect current active slot
# 2. Deploy new version to inactive slot
# 3. Wait until pods are healthy
# 4. Switch service traffic
# 5. Rollback available by switching back
#
# ============================================================

on:

  workflow_dispatch:

    inputs:

      image_tag:
        description: "Image tag to deploy"
        required: true
        type: string


      action:
        description: "Deployment action"
        required: true
        type: choice

        options:
          - deploy-and-switch
          - switch-only
          - rollback


      confirm:
        description: "Type confirm to proceed"
        required: true
        type: string



env:

  ACR_LOGIN_SERVER: netflixappprodacruks.azurecr.io

  ACR_NAME: netflixappprodacruks


  AKS_CLUSTER_NAME: netflix-app-prod-aks

  AKS_RESOURCE_GROUP: netflix-app-prod-rg-uks


  NAMESPACE: netflix-prod


  FRONTEND_IMAGE: netflix-web

  API_IMAGE: netflix-api



permissions:

  id-token: write
  contents: read



jobs:


# ============================================================
# Validate
# ============================================================


  validate:

    name: Validate Request

    runs-on: ubuntu-latest


    steps:


      - name: Validate confirmation

        run: |

          if [ "${{ github.event.inputs.confirm }}" != "confirm" ]

          then

            echo "Confirmation failed"

            exit 1

          fi


          echo "Production change approved"



# ============================================================
# Blue Green Deployment
# ============================================================


  blue-green:


    name: Blue Green Deployment


    runs-on: ubuntu-latest


    needs: validate


    environment: production



    steps:



      - name: Checkout

        uses: actions/checkout@v4





      - name: Azure Login


        uses: azure/login@v2


        with:


          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}





      - name: Get AKS credentials


        run: |


          az aks get-credentials \

          --resource-group ${{ env.AKS_RESOURCE_GROUP }} \

          --name ${{ env.AKS_CLUSTER_NAME }} \

          --overwrite-existing





# ============================================================
# Create required Kubernetes resources
# ============================================================


      - name: Create Namespace


        run: |


          kubectl create namespace ${{ env.NAMESPACE }} \

          --dry-run=client -o yaml | kubectl apply -f -





      - name: Create ConfigMap


        run: |


          kubectl create configmap netflix-app-config \

          --namespace ${{ env.NAMESPACE }} \

          --from-literal=ENVIRONMENT=production \

          --dry-run=client -o yaml | kubectl apply -f -





      - name: Create Secrets


        run: |


          kubectl create secret generic netflix-app-secrets \

          --namespace ${{ env.NAMESPACE }} \

          --from-literal=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \

          --dry-run=client -o yaml | kubectl apply -f -





# ============================================================
# Detect Slot
# ============================================================


      - name: Detect active slot


        id: slots


        run: |


          ACTIVE=$(kubectl get svc netflix-web-service \

          -n ${{ env.NAMESPACE }} \

          -o jsonpath='{.spec.selector.slot}' 2>/dev/null)



          if [ -z "$ACTIVE" ]

          then

            ACTIVE="blue"

          fi



          if [ "$ACTIVE" = "blue" ]

          then

            INACTIVE="green"

          else

            INACTIVE="blue"

          fi



          echo "active=$ACTIVE" >> $GITHUB_OUTPUT

          echo "inactive=$INACTIVE" >> $GITHUB_OUTPUT



          echo "Active slot: $ACTIVE"

          echo "Inactive slot: $INACTIVE"





# ============================================================
# Deploy inactive slot
# ============================================================


      - name: Deploy inactive slot


        if: github.event.inputs.action == 'deploy-and-switch'


        run: |


          SLOT=${{ steps.slots.outputs.inactive }}


          TAG=${{ github.event.inputs.image_tag }}



          sed \

          -e "s|__ACR_LOGIN_SERVER__|${{ env.ACR_LOGIN_SERVER }}|g" \

          -e "s|__IMAGE_TAG__|${TAG}|g" \

          k8s/prod/blue-green/deployment-${SLOT}.yml \

          | kubectl apply -f -





# ============================================================
# Wait for pods
# ============================================================


      - name: Wait for rollout


        if: github.event.inputs.action == 'deploy-and-switch'


        run: |


          SLOT=${{ steps.slots.outputs.inactive }}



          kubectl rollout status deployment/netflix-web-${SLOT} \

          -n ${{ env.NAMESPACE }} \

          --timeout=600s



          kubectl rollout status deployment/netflix-api-${SLOT} \

          -n ${{ env.NAMESPACE }} \

          --timeout=600s





# ============================================================
# Switch traffic
# ============================================================


      - name: Switch traffic


        if: github.event.inputs.action == 'deploy-and-switch' || github.event.inputs.action == 'switch-only'


        run: |


          TARGET=${{ steps.slots.outputs.inactive }}



          kubectl patch service netflix-web-service \

          -n ${{ env.NAMESPACE }} \

          --type merge \

          -p "{\"spec\":{\"selector\":{\"app\":\"netflix-web\",\"slot\":\"${TARGET}\"}}}"





          kubectl patch service netflix-api-service \

          -n ${{ env.NAMESPACE }} \

          --type merge \

          -p "{\"spec\":{\"selector\":{\"app\":\"netflix-api\",\"slot\":\"${TARGET}\"}}}"



          echo "Traffic switched to ${TARGET}"





# ============================================================
# Rollback
# ============================================================


      - name: Rollback


        if: github.event.inputs.action == 'rollback'


        run: |


          CURRENT=$(kubectl get svc netflix-web-service \

          -n ${{ env.NAMESPACE }} \

          -o jsonpath='{.spec.selector.slot}')



          if [ "$CURRENT" = "blue" ]

          then

            TARGET="green"

          else

            TARGET="blue"

          fi




          kubectl patch service netflix-web-service \

          -n ${{ env.NAMESPACE }} \

          --type merge \

          -p "{\"spec\":{\"selector\":{\"app\":\"netflix-web\",\"slot\":\"${TARGET}\"}}}"





          kubectl patch service netflix-api-service \

          -n ${{ env.NAMESPACE }} \

          --type merge \

          -p "{\"spec\":{\"selector\":{\"app\":\"netflix-api\",\"slot\":\"${TARGET}\"}}}"



          echo "Rolled back to ${TARGET}"





# ============================================================
# Verify
# ============================================================


      - name: Verify


        run: |


          echo "Current traffic slot:"


          kubectl get svc netflix-web-service \

          -n ${{ env.NAMESPACE }} \

          -o jsonpath='{.spec.selector.slot}'




          echo ""


          kubectl get pods \

          -n ${{ env.NAMESPACE }} \

          -l app=netflix-web \

          --show-labels



          kubectl get pods \

          -n ${{ env.NAMESPACE }} \

          -l app=netflix-api \

          --show-labels