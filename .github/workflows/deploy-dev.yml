name: Deploy to Dev

on:
  push:
    branches:
      - main

  workflow_dispatch:


env:
  ACR_NAME: netflixappdevacr
  ACR_LOGIN_SERVER: netflixappdevacr.azurecr.io

  AKS_CLUSTER_NAME: netflix-app-dev-aks
  AKS_RESOURCE_GROUP: netflix-app-dev-rg

  NAMESPACE: netflix-dev

  FRONTEND_IMAGE: netflix-web
  API_IMAGE: netflix-api


permissions:
  id-token: write
  contents: read


jobs:

  # ======================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ======================================================

  build-and-push:

    name: Build & Push Images To ACR

    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Generate Image Tag
      # --------------------------------------------------

      - name: Generate Image Tag
        id: meta
        shell: bash
        run: |
          echo "image_tag=$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # Azure Login
      # --------------------------------------------------

      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------
      # Verify ACR
      # --------------------------------------------------

      - name: Verify ACR Exists
        shell: bash
        run: |
          az acr show \
            --name "${{ env.ACR_NAME }}"


      # --------------------------------------------------
      # Login To ACR
      # --------------------------------------------------

      - name: Login To ACR
        shell: bash
        run: |
          az acr login \
            --name "${{ env.ACR_NAME }}"


      # ==================================================
      # FRONTEND IMAGE
      # ==================================================

      - name: Build Frontend Image
        working-directory: ./app
        shell: bash
        run: |

          docker build \
            -f Dockerfile.frontend \
            --build-arg VITE_APP_TMDB_V3_API_KEY="${{ secrets.TMDB_API_KEY }}" \
            -t "${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.image_tag }}" \
            -t "${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:latest" \
            .


      - name: Push Frontend Image
        shell: bash
        run: |

          docker push \
            "${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.image_tag }}"

          docker push \
            "${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:latest"


      # ==================================================
      # API IMAGE
      # ==================================================

      - name: Build API Image
        working-directory: ./app
        shell: bash
        run: |

          docker build \
            -f Dockerfile \
            -t "${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ steps.meta.outputs.image_tag }}" \
            -t "${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:latest" \
            .


      - name: Push API Image
        shell: bash
        run: |

          docker push \
            "${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ steps.meta.outputs.image_tag }}"

          docker push \
            "${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:latest"


      # ==================================================
      # DEPLOY TO AKS
      # ==================================================

  deploy-dev:

    name: Deploy To Dev AKS

    runs-on: ubuntu-latest

    needs:
      - build-and-push

    environment: dev

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Azure Login
      # --------------------------------------------------

      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------
      # Get AKS Credentials
      # --------------------------------------------------

      - name: Get AKS Credentials
        shell: bash
        run: |

          az aks get-credentials \
            --resource-group "${{ env.AKS_RESOURCE_GROUP }}" \
            --name "${{ env.AKS_CLUSTER_NAME }}" \
            --overwrite-existing


      # --------------------------------------------------
      # Attach ACR To AKS
      # --------------------------------------------------

      - name: Attach ACR To AKS
        shell: bash
        run: |

          az aks update \
            --name "${{ env.AKS_CLUSTER_NAME }}" \
            --resource-group "${{ env.AKS_RESOURCE_GROUP }}" \
            --attach-acr "${{ env.ACR_NAME }}"


      # --------------------------------------------------
      # Create Namespace
      # --------------------------------------------------

      - name: Create Namespace
        shell: bash
        run: |

          kubectl create namespace "${{ env.NAMESPACE }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -


      # --------------------------------------------------
      # Create Secrets
      # --------------------------------------------------

      - name: Create Secrets
        shell: bash
        run: |

          kubectl create secret generic netflix-app-secrets \
            --namespace="${{ env.NAMESPACE }}" \
            --from-literal=TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -


      # --------------------------------------------------
      # Apply ConfigMap
      # --------------------------------------------------

      - name: Apply ConfigMap
        shell: bash
        run: |

          kubectl apply \
            -f k8s/base/configmap.yml \
            -n "${{ env.NAMESPACE }}"


      # --------------------------------------------------
      # Deploy Application
      # --------------------------------------------------

      - name: Deploy Application
        shell: bash
        run: |

          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"

          echo "Deploying image tag: ${IMAGE_TAG}"

          sed \
            -e "s|__ACR_LOGIN_SERVER__|${{ env.ACR_LOGIN_SERVER }}|g" \
            -e "s|__IMAGE_TAG__|${IMAGE_TAG}|g" \
            k8s/dev/deployment.yml \
            | kubectl apply -n "${{ env.NAMESPACE }}" -f -

          kubectl apply \
            -f k8s/dev/service.yml \
            -n "${{ env.NAMESPACE }}"

          kubectl apply \
            -f k8s/dev/ingress.yml \
            -n "${{ env.NAMESPACE }}"

          kubectl apply \
            -f k8s/dev/hpa.yml \
            -n "${{ env.NAMESPACE }}"


      # --------------------------------------------------
      # Wait For Rollout
      # --------------------------------------------------

      - name: Wait For Rollout
        shell: bash
        run: |

          kubectl rollout status \
            deployment/netflix-web \
            -n "${{ env.NAMESPACE }}" \
            --timeout=600s

          kubectl rollout status \
            deployment/netflix-api \
            -n "${{ env.NAMESPACE }}" \
            --timeout=600s


      # --------------------------------------------------
      # Verify Deployment
      # --------------------------------------------------

      - name: Verify Deployment
        shell: bash
        run: |

          echo "================================"
          echo "PODS"
          echo "================================"

          kubectl get pods \
            -n "${{ env.NAMESPACE }}" \
            -o wide


          echo "================================"
          echo "SERVICES"
          echo "================================"

          kubectl get svc \
            -n "${{ env.NAMESPACE }}"


          echo "================================"
          echo "INGRESS"
          echo "================================"

          kubectl get ingress \
            -n "${{ env.NAMESPACE }}"


          echo "================================"
          echo "DEPLOYMENTS"
          echo "================================"

          kubectl get deployments \
            -n "${{ env.NAMESPACE }}"


      # --------------------------------------------------
      # Deployment Summary
      # --------------------------------------------------

      - name: Deployment Summary
        shell: bash
        run: |

          echo "========================================="
          echo "Netflix Dev Deployment Successful"
          echo "========================================="

          echo "Image Tag:"
          echo "${{ needs.build-and-push.outputs.image_tag }}"

          echo "Frontend:"
          echo "${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}"

          echo "API:"
          echo "${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}"

          echo "AKS Cluster:"
          echo "${{ env.AKS_CLUSTER_NAME }}"

          echo "Namespace:"
          echo "${{ env.NAMESPACE }}"


  # ======================================================
  # EMAIL NOTIFICATION
  # ======================================================

  notify:

    name: Deployment Notification

    runs-on: ubuntu-latest

    needs:
      - build-and-push
      - deploy-dev

    if: success()

    steps:

      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:

          server_address: smtp.gmail.com
          server_port: 465

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "Netflix Dev Deployment Successful"

          to: peacerotimi6@gmail.com
          from: peacerotimi6@gmail.com

          body: |

            Netflix Streaming App deployment completed successfully.

            ==============================
            IMAGE INFORMATION
            ==============================

            Frontend:
            netflixappdevacr.azurecr.io/netflix-web:${{ needs.build-and-push.outputs.image_tag }}

            API:
            netflixappdevacr.azurecr.io/netflix-api:${{ needs.build-and-push.outputs.image_tag }}

            ==============================
            KUBERNETES INFORMATION
            ==============================

            Cluster:
            netflix-app-dev-aks

            Namespace:
            netflix-dev

            ==============================
            IMAGE TAG
            ==============================

            ${{ needs.build-and-push.outputs.image_tag }}

            ==============================
            STATUS
            ==============================

            Deployment completed successfully.