name: Deploy to Dev

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_NAME: netflixappdevacr
  ACR_LOGIN_SERVER: netflixappdevacr.azurecr.io

  AKS_CLUSTER_NAME: netflix-app-dev-aks
  AKS_RESOURCE_GROUP: netflix-app-dev-rg

  NAMESPACE: netflix-dev

  FRONTEND_IMAGE: netflix-web
  API_IMAGE: netflix-api

permissions:
  id-token: write
  contents: read


jobs:

# ======================================================
# SONARCLOUD ANALYSIS
# ======================================================
  sonarcloud-analysis:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: ./app
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# ======================================================
# BUILD AND PUSH IMAGES
# ======================================================
  build-and-push:

    name: Build & Push Images To ACR
    runs-on: ubuntu-latest

    needs: sonarcloud-analysis

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Generate Image Tag
        id: meta
        run: |
          echo "image_tag=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT


      - name: Azure Login OIDC
        uses: azure/login@v2

        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      - name: Verify ACR Exists
        run: |
          az acr show \
            --name ${{ env.ACR_NAME }} \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }}


      - name: Login To ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}



# ---------------- FRONTEND ----------------

      - name: Build and Push Frontend

        working-directory: ./app

        run: |

          docker build \
          -f Dockerfile.frontend \
          --build-arg VITE_APP_TMDB_V3_API_KEY=${{ secrets.TMDB_API_KEY }} \
          -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.image_tag }} \
          -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:latest \
          .


          docker push \
          ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.image_tag }}


          docker push \
          ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:latest



# ---------------- API ----------------

      - name: Build and Push API

        working-directory: ./app

        run: |

          docker build \
          -f Dockerfile \
          -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ steps.meta.outputs.image_tag }} \
          -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:latest \
          .


          docker push \
          ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ steps.meta.outputs.image_tag }}


          docker push \
          ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:latest



# ---------------- SECURITY SCAN ----------------


      - name: Trivy Scan Frontend

        uses: aquasecurity/trivy-action@master

        with:

          image-ref:
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.image_tag }}

          format: table

          exit-code: 0

          severity: CRITICAL,HIGH



      - name: Trivy Scan API

        uses: aquasecurity/trivy-action@master

        with:

          image-ref:
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ steps.meta.outputs.image_tag }}

          format: table

          exit-code: 0

          severity: CRITICAL,HIGH



# ======================================================
# DEPLOY TO AKS
# ======================================================

  deploy-dev:

    name: Deploy To Dev AKS

    runs-on: ubuntu-latest

    needs: build-and-push

    environment: dev


    steps:


      - name: Checkout code
        uses: actions/checkout@v4



      - name: Azure Login OIDC

        uses: azure/login@v2

        with:

          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}



      - name: Get AKS Credentials

        run: |

          az aks get-credentials \
          --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
          --name ${{ env.AKS_CLUSTER_NAME }} \
          --overwrite-existing



      - name: Install Namespace

        run: |

          kubectl create namespace ${{ env.NAMESPACE }} \
          --dry-run=client -o yaml | kubectl apply -f -



      - name: Create Application Secret

        run: |

          kubectl create secret generic netflix-app-secrets \
          --namespace=${{ env.NAMESPACE }} \
          --from-literal=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \
          --dry-run=client -o yaml | kubectl apply -f -



      - name: Apply ConfigMap

        run: |

          kubectl apply \
          -f k8s/base/configmap.yml \
          -n ${{ env.NAMESPACE }}



      - name: Deploy Application

        run: |

          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}


          sed \
          -e "s|__ACR_LOGIN_SERVER__|${{ env.ACR_LOGIN_SERVER }}|g" \
          -e "s|__IMAGE_TAG__|${IMAGE_TAG}|g" \
          k8s/dev/deployment.yml | kubectl apply -f -


          kubectl apply -f k8s/dev/service.yml

          kubectl apply -f k8s/dev/ingress.yml

          kubectl apply -f k8s/dev/hpa.yml



      - name: Wait For Rollout

        run: |

          kubectl rollout status deployment/netflix-web \
          -n ${{ env.NAMESPACE }} \
          --timeout=600s


          kubectl rollout status deployment/netflix-api \
          -n ${{ env.NAMESPACE }} \
          --timeout=600s



      - name: Verify Deployment

        run: |

          kubectl get pods -n ${{ env.NAMESPACE }}

          kubectl get svc -n ${{ env.NAMESPACE }}

          kubectl get ingress -n ${{ env.NAMESPACE }}



# ======================================================
# NOTIFICATION
# ======================================================

  notify:

    name: Deployment Notification

    runs-on: ubuntu-latest

    needs:
      - build-and-push
      - deploy-dev

    if: success()


    steps:

      - name: Send Email

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.gmail.com

          server_port: 465

          username: ${{ secrets.SMTP_USERNAME }}

          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "Netflix Dev Deployment Successful"

          to: peacerotimi6@gmail.com

          from: peacerotimi6@gmail.com


          body: |

            Netflix Streaming App deployment completed successfully.

            Images:

            Frontend:
            netflixappdevacr.azurecr.io/netflix-web:${{ needs.build-and-push.outputs.image_tag }}

            API:
            netflixappdevacr.azurecr.io/netflix-api:${{ needs.build-and-push.outputs.image_tag }}


            Cluster:
            netflix-app-dev-aks

            Namespace:
            netflix-dev