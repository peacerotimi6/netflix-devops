name: Deploy to Production


on:
  workflow_dispatch:

    inputs:

      image_tag:

        description: "Image tag to deploy (example: f18d3d1)"

        required: true

        type: string


      confirm_deploy:

        description: "Type deploy-prod to confirm"

        required: true

        type: string



env:

  PROD_ACR_NAME: netflixappprodacr

  PROD_ACR_LOGIN_SERVER: netflixappprodacr.azurecr.io


  DEV_ACR_LOGIN_SERVER: netflixappdevacr.azurecr.io


  AKS_CLUSTER_NAME: netflix-app-prod-aks

  AKS_RESOURCE_GROUP: netflix-app-prod-rg


  NAMESPACE: netflix-prod



permissions:

  id-token: write

  contents: read




jobs:



# =====================================================
# Validate Production Approval
# =====================================================


  validate:


    name: Validate Deployment


    runs-on: ubuntu-latest



    steps:


      - name: Check confirmation


        run: |


          if [ "${{ github.event.inputs.confirm_deploy }}" != "deploy-prod" ]

          then

            echo "Invalid confirmation"

            exit 1

          fi


          echo "Production deployment approved"






# =====================================================
# SonarCloud
# =====================================================


  sonarcloud:


    name: SonarCloud Scan


    runs-on: ubuntu-latest


    needs: validate



    steps:


      - name: Checkout

        uses: actions/checkout@v4


        with:

          fetch-depth: 0




      - name: SonarCloud Analysis


        uses: SonarSource/sonarcloud-github-action@v2


        with:


          projectBaseDir: ./app


          args: >

            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}



        env:


          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}






# =====================================================
# Promote Images
# =====================================================


  promote-images:



    name: Import Images Into Production ACR



    runs-on: ubuntu-latest



    needs: sonarcloud



    steps:



      - name: Azure Login


        uses: azure/login@v2


        with:


          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}






      - name: Debug Variables


        run: |


          echo "================================"

          echo "IMAGE TAG: ${{ github.event.inputs.image_tag }}"

          echo "DEV ACR: netflixappdevacr.azurecr.io"

          echo "PROD ACR: netflixappprodacr"

          echo "================================"






      - name: Check Dev Frontend Image Exists


        run: |


          az acr repository show-tags \

          --name netflixappdevacr \

          --repository netflix-web \

          --output table






      - name: Check Dev API Image Exists


        run: |


          az acr repository show-tags \

          --name netflixappdevacr \

          --repository netflix-api \

          --output table






      - name: Import Frontend Image


        run: |


          az acr import \

          --name netflixappprodacr \

          --source netflixappdevacr.azurecr.io/netflix-web:${{ github.event.inputs.image_tag }} \

          --image netflix-web:${{ github.event.inputs.image_tag }} \

          --force






      - name: Import API Image


        run: |


          az acr import \

          --name netflixappprodacr \

          --source netflixappdevacr.azurecr.io/netflix-api:${{ github.event.inputs.image_tag }} \

          --image netflix-api:${{ github.event.inputs.image_tag }} \

          --force







      - name: Login Production ACR


        run: |


          az acr login --name netflixappprodacr







      - name: Trivy Frontend Scan


        uses: aquasecurity/trivy-action@master


        with:


          image-ref: netflixappprodacr.azurecr.io/netflix-web:${{ github.event.inputs.image_tag }}


          format: table


          severity: CRITICAL,HIGH







      - name: Trivy API Scan


        uses: aquasecurity/trivy-action@master


        with:


          image-ref: netflixappprodacr.azurecr.io/netflix-api:${{ github.event.inputs.image_tag }}


          format: table


          severity: CRITICAL,HIGH







# =====================================================
# Deploy AKS
# =====================================================


  deploy-prod:



    name: Deploy Production AKS


    runs-on: ubuntu-latest


    needs: promote-images



    environment: production





    steps:



      - name: Checkout


        uses: actions/checkout@v4






      - name: Azure Login


        uses: azure/login@v2


        with:


          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}






      - name: Get AKS Credentials


        run: |


          az aks get-credentials \

          --resource-group netflix-app-prod-rg \

          --name netflix-app-prod-aks \

          --overwrite-existing






      - name: Create Namespace


        run: |


          kubectl create namespace netflix-prod \

          --dry-run=client -o yaml | kubectl apply -f -






      - name: Create Secrets


        run: |


          kubectl create secret generic netflix-app-secrets \

          --namespace netflix-prod \

          --from-literal=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \

          --dry-run=client -o yaml | kubectl apply -f -






      - name: Deploy Kubernetes


        run: |


          sed \

          -e "s|__ACR_LOGIN_SERVER__|netflixappprodacr.azurecr.io|g" \

          -e "s|__IMAGE_TAG__|${{ github.event.inputs.image_tag }}|g" \

          k8s/prod/deployment.yml | kubectl apply -f -



          kubectl apply -f k8s/prod/service.yml -n netflix-prod


          kubectl apply -f k8s/prod/ingress.yml -n netflix-prod


          kubectl apply -f k8s/prod/hpa.yml -n netflix-prod







      - name: Rollout Status


        run: |


          kubectl rollout status deployment/netflix-web \

          -n netflix-prod \

          --timeout=600s



          kubectl rollout status deployment/netflix-api \

          -n netflix-prod \

          --timeout=600s







      - name: Verify Production


        run: |


          kubectl get deployments -n netflix-prod


          kubectl get pods -n netflix-prod


          kubectl get services -n netflix-prod


          kubectl get ingress -n netflix-prod







# =====================================================
# Smoke Test
# =====================================================


  smoke-test:


    name: Production Smoke Test


    runs-on: ubuntu-latest


    needs: deploy-prod



    steps:


      - name: Azure Login


        uses: azure/login@v2


        with:


          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}





      - name: Get AKS


        run: |


          az aks get-credentials \

          --resource-group netflix-app-prod-rg \

          --name netflix-app-prod-aks \

          --overwrite-existing






      - name: Check Application


        run: |


          kubectl get pods -n netflix-prod


          echo "Production deployment successful"