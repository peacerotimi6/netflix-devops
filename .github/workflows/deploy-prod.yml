name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag from Dev deployment (example: 5fe40ad)"
        required: true
        type: string

      confirm_deploy:
        description: "Type deploy-prod to confirm"
        required: true
        type: string


env:

  # Production ACR
  ACR_NAME: netflixappprodacr
  ACR_LOGIN_SERVER: netflixappprodacr.azurecr.io

  # Development ACR
  DEV_ACR_LOGIN_SERVER: netflixappdevacr.azurecr.io

  # AKS Production
  AKS_CLUSTER_NAME: netflix-app-prod-aks
  AKS_RESOURCE_GROUP: netflix-app-prod-rg

  NAMESPACE: netflix-prod


  FRONTEND_IMAGE: netflix-web
  API_IMAGE: netflix-api



permissions:
  id-token: write
  contents: read



jobs:


# =====================================================
# Validate Approval
# =====================================================

  validate:

    name: Validate Production Approval

    runs-on: ubuntu-latest


    steps:

      - name: Confirm deployment

        run: |

          if [ "${{ inputs.confirm_deploy }}" != "deploy-prod" ]; then

            echo "Deployment not approved"

            exit 1

          fi


          echo "Production deployment approved"



# =====================================================
# SonarCloud
# =====================================================

  sonarcloud:


    name: SonarCloud Quality Gate

    runs-on: ubuntu-latest

    needs: validate


    steps:


      - name: Checkout

        uses: actions/checkout@v4

        with:

          fetch-depth: 0



      - name: SonarCloud Scan

        uses: SonarSource/sonarcloud-github-action@v2


        with:

          projectBaseDir: ./app

          args: >

            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}


        env:

          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



# =====================================================
# Import Images Dev ACR -> Prod ACR
# =====================================================


  promote-images:


    name: Promote Images To Production ACR

    runs-on: ubuntu-latest

    needs: sonarcloud



    steps:


      - name: Azure Login

        uses: azure/login@v2

        with:

          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}



      - name: Import Frontend Image


        run: |


          echo "Importing frontend image"


          az acr import \

          --name ${{ env.ACR_NAME }} \

          --source ${{ env.DEV_ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ inputs.image_tag }} \

          --image ${{ env.FRONTEND_IMAGE }}:${{ inputs.image_tag }} \

          --force





      - name: Import API Image


        run: |


          echo "Importing API image"


          az acr import \

          --name ${{ env.ACR_NAME }} \

          --source ${{ env.DEV_ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ inputs.image_tag }} \

          --image ${{ env.API_IMAGE }}:${{ inputs.image_tag }} \

          --force





      - name: Verify Production Images


        run: |


          echo "Frontend Images"

          az acr repository show-tags \

          --name ${{ env.ACR_NAME }} \

          --repository ${{ env.FRONTEND_IMAGE }} \

          --output table



          echo "API Images"


          az acr repository show-tags \

          --name ${{ env.ACR_NAME }} \

          --repository ${{ env.API_IMAGE }} \

          --output table





      - name: Login Production ACR


        run: |


          az acr login --name ${{ env.ACR_NAME }}






      - name: Trivy Frontend Scan


        uses: aquasecurity/trivy-action@master


        with:

          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ inputs.image_tag }}

          format: table

          severity: CRITICAL,HIGH





      - name: Trivy API Scan


        uses: aquasecurity/trivy-action@master


        with:


          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ inputs.image_tag }}

          format: table

          severity: CRITICAL,HIGH






# =====================================================
# Deploy To Production AKS
# =====================================================


  deploy-prod:


    name: Deploy Production AKS

    runs-on: ubuntu-latest

    needs: promote-images


    environment: production



    steps:


      - name: Checkout

        uses: actions/checkout@v4





      - name: Azure Login


        uses: azure/login@v2


        with:

          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}






      - name: Get AKS Credentials


        run: |


          az aks get-credentials \

          --resource-group ${{ env.AKS_RESOURCE_GROUP }} \

          --name ${{ env.AKS_CLUSTER_NAME }} \

          --overwrite-existing





      - name: Create Namespace


        run: |


          kubectl create namespace ${{ env.NAMESPACE }} \

          --dry-run=client -o yaml | kubectl apply -f -





      - name: Create Secrets


        run: |


          kubectl create secret generic netflix-app-secrets \

          --namespace ${{ env.NAMESPACE }} \

          --from-literal=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \

          --dry-run=client -o yaml | kubectl apply -f -





      - name: Deploy Application


        run: |


          sed \

          -e "s|__ACR_LOGIN_SERVER__|${{ env.ACR_LOGIN_SERVER }}|g" \

          -e "s|__IMAGE_TAG__|${{ inputs.image_tag }}|g" \

          k8s/prod/deployment.yml | kubectl apply -f -



          kubectl apply -f k8s/prod/service.yml

          kubectl apply -f k8s/prod/ingress.yml

          kubectl apply -f k8s/prod/hpa.yml





      - name: Wait For Rollout


        run:


          kubectl rollout status deployment/netflix-web \
          -n ${{ env.NAMESPACE }} \
          --timeout=600s



          kubectl rollout status deployment/netflix-api \
          -n ${{ env.NAMESPACE }} \
          --timeout=600s





      - name: Verify Production


        run: |


          echo "Deployments"

          kubectl get deployments -n ${{ env.NAMESPACE }}



          echo "Pods"

          kubectl get pods -n ${{ env.NAMESPACE }}



          echo "Services"

          kubectl get svc -n ${{ env.NAMESPACE }}
