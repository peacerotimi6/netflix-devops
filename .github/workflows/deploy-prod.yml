name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (example: f18d3d1)"
        required: true
        type: string

      confirm_deploy:
        description: "Type deploy-prod to confirm"
        required: true
        type: string


env:
  ACR_NAME: netflixappprodacr
  ACR_LOGIN_SERVER: netflixappprodacr.azurecr.io

  DEV_ACR_LOGIN_SERVER: netflixappdevacr.azurecr.io

  AKS_CLUSTER_NAME: netflix-app-prod-aks
  AKS_RESOURCE_GROUP: netflix-app-prod-rg

  NAMESPACE: netflix-prod

  FRONTEND_IMAGE: netflix-web
  API_IMAGE: netflix-api


permissions:
  id-token: write
  contents: read



jobs:


# =====================================================
# Validate Deployment
# =====================================================

  validate:

    name: Validate Production Approval

    runs-on: ubuntu-latest


    steps:

      - name: Verify confirmation

        run: |

          if [ "${{ github.event.inputs.confirm_deploy }}" != "deploy-prod" ]; then

            echo "Invalid confirmation"

            exit 1

          fi

          echo "Production deployment approved"



# =====================================================
# SonarCloud Check
# =====================================================


  sonarcloud:

    name: SonarCloud Quality Gate

    runs-on: ubuntu-latest

    needs: validate


    steps:


      - name: Checkout

        uses: actions/checkout@v4

        with:

          fetch-depth: 0



      - name: SonarCloud Scan

        uses: SonarSource/sonarcloud-github-action@v2


        with:

          projectBaseDir: ./app

          args: >

            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}


        env:

          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



# =====================================================
# Promote Images Dev ACR -> Prod ACR
# =====================================================


  promote-images:


    name: Promote Images To Production ACR

    runs-on: ubuntu-latest

    needs: sonarcloud



    steps:


      - name: Azure Login

        uses: azure/login@v2

        with:

          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}



      - name: Import Frontend Image

        run: |


          az acr import \

          --name ${{ env.ACR_NAME }} \

          --source ${{ env.DEV_ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ inputs.image_tag }} \

          --image ${{ env.FRONTEND_IMAGE }}:${{ inputs.image_tag }} \

          --force




      - name: Import API Image

        run: |


          az acr import \

          --name ${{ env.ACR_NAME }} \

          --source ${{ env.DEV_ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ inputs.image_tag }} \

          --image ${{ env.API_IMAGE }}:${{ inputs.image_tag }} \

          --force



      - name: Login Production ACR

        run: |

          az acr login --name ${{ env.ACR_NAME }}



      - name: Trivy Frontend Production Scan

        uses: aquasecurity/trivy-action@master


        with:

          image-ref: |

            ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${{ inputs.image_tag }}


          format: table

          severity: CRITICAL,HIGH



      - name: Trivy API Production Scan

        uses: aquasecurity/trivy-action@master


        with:

          image-ref: |

            ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ inputs.image_tag }}


          format: table

          severity: CRITICAL,HIGH
#