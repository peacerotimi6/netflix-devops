name: CI - Build, Test & Security Scan

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - develop


env:
  NODE_VERSION: "18"
  PYTHON_VERSION: "3.10"


permissions:
  contents: read
  pull-requests: write
  security-events: write


jobs:

# -------------------------------------------------------
# Job 1: Build Frontend
# -------------------------------------------------------

  build-frontend:

    name: Build Frontend

    runs-on: ubuntu-latest


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json


      - name: Install dependencies
        working-directory: ./app
        run: npm ci


      - name: TypeScript Check
        working-directory: ./app
        run: npx tsc --noEmit


      - name: Build React Application
        working-directory: ./app
        env:
          VITE_APP_TMDB_V3_API_KEY: ${{ secrets.TMDB_API_KEY }}
          VITE_APP_API_ENDPOINT_URL: https://api.themoviedb.org/3
        run: npm run build


      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: app/dist/
          retention-days: 1




# -------------------------------------------------------
# Job 2: SonarCloud Security Scan
# -------------------------------------------------------

  sonarcloud:

    name: SonarCloud Analysis

    runs-on: ubuntu-latest

    needs: build-frontend


    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"


      - name: Verify Java Version
        run: java -version


      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3

        with:

          projectBaseDir: ./app

          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}


        env:

          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}






# -------------------------------------------------------
# Job 3: Trivy Filesystem Scan
# -------------------------------------------------------

  trivy-fs-scan:

    name: Trivy Filesystem Scan

    runs-on: ubuntu-latest


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master

        with:

          scan-type: fs

          scan-ref: .

          format: sarif

          output: trivy-fs-results.sarif

          severity: CRITICAL,HIGH



      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3

        if: always()

        with:

          sarif_file: trivy-fs-results.sarif






# -------------------------------------------------------
# Job 4: Docker Image Security Scan
# -------------------------------------------------------

  trivy-image-scan:

    name: Trivy Docker Image Scan

    runs-on: ubuntu-latest

    needs: build-frontend


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Build Docker Image For Scan
        working-directory: ./app

        run: |

          docker build \
          -f Dockerfile.frontend \
          --build-arg VITE_APP_TMDB_V3_API_KEY=scan-placeholder \
          --build-arg VITE_APP_API_ENDPOINT_URL=https://api.themoviedb.org/3 \
          -t netflix-app:scan .



      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master

        with:

          image-ref: netflix-app:scan

          format: sarif

          output: trivy-image-results.sarif

          severity: CRITICAL,HIGH




      - name: Upload Image Scan Results
        uses: github/codeql-action/upload-sarif@v3

        if: always()

        with:

          sarif_file: trivy-image-results.sarif






# -------------------------------------------------------
# Job 5: Checkov Infrastructure Scan
# -------------------------------------------------------

  checkov-scan:

    name: Checkov IaC Scan

    runs-on: ubuntu-latest


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Install Checkov
        run: pip install checkov


      - name: Scan Terraform

        run: |

          checkov \
          -d Modules \
          --framework terraform \
          --output sarif \
          --output-file-path checkov-terraform.sarif \
          --skip-check CKV_AZURE_131,CKV2_AZURE_31 \
          --soft-fail || true



      - name: Scan Kubernetes Manifests

        run: |

          checkov \
          -d k8s \
          --framework kubernetes \
          --output sarif \
          --output-file-path checkov-k8s.sarif \
          --soft-fail || true



      - name: Upload Terraform Scan
        uses: github/codeql-action/upload-sarif@v3

        if: always()

        with:

          sarif_file: checkov-terraform.sarif

          category: checkov-terraform



      - name: Upload Kubernetes Scan
        uses: github/codeql-action/upload-sarif@v3

        if: always()

        with:

          sarif_file: checkov-k8s.sarif

          category: checkov-kubernetes