# ============================================================
# Blue Slot Deployment
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: netflix-web-blue
  namespace: netflix-prod

  labels:
    app: netflix-web
    slot: blue
    environment: prod

  annotations:
    checkov.io/skip1: "CKV_K8S_43=Image digest pinning not used; tags managed by CI/CD pipeline"
    checkov.io/skip2: "CKV_K8S_22=Nginx requires write access to temp directories"


spec:

  replicas: 3

  progressDeadlineSeconds: 900


  selector:

    matchLabels:
      app: netflix-web
      slot: blue



  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxSurge: 1

      maxUnavailable: 0



  template:

    metadata:

      labels:

        app: netflix-web

        slot: blue

        environment: prod



    spec:

      automountServiceAccountToken: false


      securityContext:

        runAsNonRoot: true

        runAsUser: 10001

        seccompProfile:

          type: RuntimeDefault



      containers:


      - name: netflix-web


        image: __ACR_LOGIN_SERVER__/netflix-web:__IMAGE_TAG__


        imagePullPolicy: Always



        ports:

        - containerPort: 8080

          protocol: TCP



        envFrom:

        - configMapRef:

            name: netflix-app-config



        resources:


          requests:

            cpu: "200m"

            memory: "256Mi"



          limits:

            cpu: "500m"

            memory: "512Mi"




        securityContext:

          allowPrivilegeEscalation: false

          readOnlyRootFilesystem: false

          runAsNonRoot: true

          runAsUser: 10001

          capabilities:

            drop:

            - ALL





        livenessProbe:

          httpGet:

            path: /health

            port: 8080


          initialDelaySeconds: 10

          periodSeconds: 30

          timeoutSeconds: 5

          failureThreshold: 3




        readinessProbe:

          httpGet:

            path: /health

            port: 8080


          initialDelaySeconds: 5

          periodSeconds: 10

          timeoutSeconds: 3

          failureThreshold: 3



      restartPolicy: Always



      topologySpreadConstraints:

      - maxSkew: 1

        topologyKey: kubernetes.io/hostname

        whenUnsatisfiable: DoNotSchedule

        labelSelector:

          matchLabels:

            app: netflix-web

            slot: blue





---

# ============================================================
# Netflix API Blue Slot
# ============================================================


apiVersion: apps/v1
kind: Deployment


metadata:

  name: netflix-api-blue

  namespace: netflix-prod


  labels:

    app: netflix-api

    slot: blue

    environment: prod


  annotations:

    checkov.io/skip1: "CKV_K8S_43=Image digest pinning not used; tags managed by CI/CD pipeline"

    checkov.io/skip2: "CKV_K8S_35=Secrets injected using secretRef"

    checkov.io/skip3: "CKV_K8S_22=Application requires runtime cache"



spec:


  replicas: 2


  progressDeadlineSeconds: 900



  selector:


    matchLabels:

      app: netflix-api

      slot: blue




  strategy:


    type: RollingUpdate


    rollingUpdate:


      maxSurge: 1


      maxUnavailable: 0




  template:


    metadata:


      labels:


        app: netflix-api

        slot: blue

        environment: prod





    spec:


      automountServiceAccountToken: false



      securityContext:


        runAsNonRoot: true


        runAsUser: 10001


        seccompProfile:


          type: RuntimeDefault





      containers:


      - name: netflix-api



        image: __ACR_LOGIN_SERVER__/netflix-api:__IMAGE_TAG__



        imagePullPolicy: Always




        ports:


        - containerPort: 8080

          protocol: TCP





        envFrom:


        - secretRef:


            name: netflix-app-secrets





        resources:



          requests:


            cpu: "200m"


            memory: "1Gi"





          limits:


            cpu: "1000m"


            memory: "2Gi"





        securityContext:


          allowPrivilegeEscalation: false


          readOnlyRootFilesystem: false


          runAsNonRoot: true


          runAsUser: 10001


          capabilities:


            drop:


            - ALL





        startupProbe:


          httpGet:


            path: /


            port: 8080


          failureThreshold: 30

          periodSeconds: 10

          timeoutSeconds: 5





        livenessProbe:


          httpGet:


            path: /

            port: 8080


          initialDelaySeconds: 5

          periodSeconds: 30

          timeoutSeconds: 5

          failureThreshold: 3





        readinessProbe:


          httpGet:


            path: /

            port: 8080


          initialDelaySeconds: 5

          periodSeconds: 10

          timeoutSeconds: 5

          failureThreshold: 3